bot:
  # flit pins flit-core to its own version, and both are released to PyPI at
  # the same moment. Without this, the autotick bot opens the flit version PR
  # immediately and CI fails until flit-core-feedstock has built and uploaded.
  # With it, the bot only opens the PR once the recipe actually solves.
  check_solvable: true
provider: {linux_aarch64: azure, linux_ppc64le: azure, win: azure}
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  pkg_format: '2'
